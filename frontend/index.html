<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Мой Менеджер Задач</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <span id="connectionStatus">Проверка...</span>
    <button id="logoutBtn" onclick="logout()" class="hidden">Выйти</button>
</header>

<div id="errorAlert" class="hidden box" style="border-color: red; color: red;">
    <span id="errorAlertText"></span>
</div>

<div id="loginView" class="container">
    <h2>Вход</h2>
    <form id="loginForm">
        <input type="text" id="loginUser" placeholder="Логин (admin)" value="" required>
        <input type="password" id="loginPass" placeholder="Пароль (123)" value="" required>
        <button type="submit">Войти</button>
    </form>
</div>

<div id="dashboardView" class="container hidden">

    <section class="box">
        <h3>Новая задача</h3>
        <form id="taskForm">
            <input type="text" id="taskTitle" placeholder="Что нужно сделать? (мин. 5 симв.)" required>
            <textarea id="taskDescription" placeholder="Описание (необязательно)"></textarea>
            <input type="datetime-local" id="taskDate" required>
            <select id="taskStatus">
                <option value="PENDING">Ожидает</option>
                <option value="IN_PROGRESS">В процессе</option>
                <option value="COMPLETED">Завершено</option>
            </select>
            <button type="submit" style="background-color: green;">Создать задачу</button>
        </form>
    </section>

    <h2>Список задач</h2>
    <div id="taskList"></div>
</div>

<script src="app.js"></script>
</body>
</html>
