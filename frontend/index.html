<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Менеджер задач</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <span class="navbar-brand mb-0 h1">GreenThread Tasks</span>
        <div class="d-flex items-center">
            <span id="connectionStatus" class="badge bg-warning text-dark">Подключение...</span>
            <button id="logoutBtn" onclick="logout()" class="btn btn-outline-light btn-sm ms-3 d-none">Выйти</button>
        </div>
    </div>
</nav>

<div class="container">
    <div id="errorAlert" class="alert alert-danger alert-dismissible fade show d-none" role="alert">
        <strong id="errorAlertTitle">Ошибка!</strong> <span id="errorAlertText"></span>
        <button type="button" class="btn-close" onclick="document.getElementById('errorAlert').classList.add('d-none')"></button>
    </div>
</div>

<div id="loginView" class="container">
    <div class="row justify-content-center mt-5">
        <div class="col-md-5">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white font-weight-bold">
                    Вход в систему
                </div>
                <div class="card-body p-4">
                    <form id="loginForm">
                        <div class="mb-3">
                            <label for="loginUser" class="form-label">Имя пользователя</label>
                            <input type="text" class="form-control" id="loginUser" value="admin" required>
                        </div>
                        <div class="mb-3">
                            <label for="loginPass" class="form-label">Пароль</label>
                            <input type="password" class="form-control" id="loginPass" value="123" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Войти</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<div id="dashboardView" class="container d-none">
    <div class="row items-start">

        <div class="col-lg-4 mb-4">
            <div class="card shadow-sm sticky-top" style="top: 20px;">
                <div class="card-header bg-success text-white">
                    Создать новую задачу
                </div>
                <div class="card-body">
                    <form id="taskForm">
                        <div class="mb-3">
                            <label for="taskTitle" class="form-label">Название (мин. 5 символов) *</label>
                            <input type="text" class="form-control" id="taskTitle" minlength="5" maxlength="100" required placeholder="Например, Подготовить отчет">
                        </div>
                        <div class="mb-3">
                            <label for="taskDescription" class="form-label">Описание</label>
                            <textarea class="form-control" id="taskDescription" rows="3" maxlength="500"></textarea>
                        </div>
                        <div class="mb-3">
                            <label for="taskDate" class="form-label">Срок выполнения (Будущее) *</label>
                            <input type="datetime-local" class="form-control" id="taskDate" required>
                        </div>
                        <div class="mb-3">
                            <label for="taskStatus" class="form-label">Статус</label>
                            <select class="form-select" id="taskStatus">
                                <option value="PENDING">PENDING</option>
                                <option value="IN_PROGRESS">IN_PROGRESS</option>
                                <option value="COMPLETED">COMPLETED</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-success w-100">Добавить задачу</button>
                    </form>
                </div>
            </div>
        </div>

        <div class="col-lg-8">
            <div class="d-flex justify-content-between items-center mb-3">
                <h3>Актуальные задачи</h3>
                <button onclick="fetchData()" class="btn btn-outline-secondary btn-sm">Обновить данные</button>
            </div>
            <div id="taskList" class="accordion shadow-sm">
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="editTaskModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Редактировать задачу</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form id="editTaskForm">
                <div class="modal-body">
                    <input type="hidden" id="editTaskId">
                    <div class="mb-3">
                        <label for="editTaskTitle" class="form-label">Название *</label>
                        <input type="text" class="form-control" id="editTaskTitle" minlength="5" maxlength="100" required>
                    </div>
                    <div class="mb-3">
                        <label for="editTaskDescription" class="form-label">Описание</label>
                        <textarea class="form-control" id="editTaskDescription" rows="3" maxlength="500"></textarea>
                    </div>
                    <div class="mb-3">
                        <label for="editTaskDate" class="form-label">Срок выполнения *</label>
                        <input type="datetime-local" class="form-control" id="editTaskDate" required>
                    </div>
                    <div class="mb-3">
                        <label for="editTaskStatus" class="form-label">Статус (Соблюдение конечного автомата)</label>
                        <select class="form-select" id="editTaskStatus">
                            <option value="PENDING">PENDING</option>
                            <option value="IN_PROGRESS">IN_PROGRESS</option>
                            <option value="COMPLETED">COMPLETED</option>
                        </select>
                        <div class="form-text text-muted">Правила: PENDING ➔ IN_PROGRESS ➔ COMPLETED. Завершенные задачи блокируются.</div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
                    <button type="submit" class="btn btn-primary">Сохранить изменения</button>
                </div>
            </form>
        </div>
    </div>
</div>

<div class="modal fade" id="subtaskModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Добавить подзадачу</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form id="subtaskForm">
                <div class="modal-body">
                    <input type="hidden" id="parentTaskId">
                    <div class="mb-3">
                        <label for="subtaskTitle" class="form-label">Название подзадачи (мин. 5 символов) *</label>
                        <input type="text" class="form-control" id="subtaskTitle" minlength="5" maxlength="100" required placeholder="Проверить пункт 1">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
                    <button type="submit" class="btn btn-success">Создать</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="app.js"></script>
</body>
</html>
