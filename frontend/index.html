<!DOCTYPE html>
<html lang="eng">
<head>
    <meta charset="UTF-8">
    <title>GreenThread Task Management</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <span id="connectionStatus">Connection...</span>
    <button id="logoutBtn" onclick="logout()" class="hidden">Exit</button>
</header>

<div id="errorAlert" class="hidden box" style="border-color: red; color: red;">
    <span id="errorAlertText"></span>
</div>

<div id="loginView" class="container">
    <h2>Entrance</h2>
    <form id="loginForm">
        <input type="text" id="loginUser" placeholder="Login" value="" required>
        <input type="password" id="loginPass" placeholder="Password" value="" required>
        <button type="submit">Log in</button>
    </form>
</div>

<div id="dashboardView" class="container hidden">

    <section class="box">
        <h3>New task</h3>
        <form id="taskForm">
            <input type="text" id="taskTitle" placeholder="Title (min. 5 symbols)" required>
            <textarea id="taskDescription" placeholder="Description (optional)"></textarea>
            <input type="datetime-local" id="taskDate" required>
            <select id="taskStatus">
                <option value="PENDING">PENDING</option>
                <option value="IN_PROGRESS">IN PROGRESS</option>
                <option value="COMPLETED">COMPLETED</option>
            </select>
            <button type="submit" style="background-color: green;">Create task</button>
        </form>
    </section>

    <h2>Task list</h2>
    <div id="taskList"></div>
</div>

<div id="editTaskModal" class="modal-overlay hidden">
    <div class="modal-content container box">
        <h2>Edit task</h2>
        <form id="editTaskForm">
            <input type="hidden" id="editTaskId"> <label>Title:</label>
            <input type="text" id="editTaskTitle" required minlength="5">

            <label>Description:</label>
            <textarea id="editTaskDescription" rows="3"></textarea>

            <label>Due data:</label>
            <input type="datetime-local" id="editTaskDate" required>

            <label>Status:</label>
            <select id="editTaskStatus">
                <option value="PENDING">PENDING</option>
                <option value="IN_PROGRESS">IN PROGRESS</option>
                <option value="COMPLETED">COMPLETED</option>
            </select>

            <div style="display: flex; gap: 10px; margin-top: 15px;">
                <button type="submit">Save</button>
                <button type="button" onclick="closeEditModal()" style="background-color: gray;">Cancel</button>
            </div>
        </form>
    </div>
</div>

<script src="app.js"></script>
</body>
</html>
