<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GreenThread Task Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 font-sans pb-12">

<header class="bg-white border-b border-slate-200 sticky top-0 z-10">
    <div class="max-w-5xl mx-auto px-4 py-4 flex justify-between items-center">
        <div class="flex items-center gap-2">
            <svg class="w-6 h-6 text-emerald-600" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <h1 class="text-xl font-bold tracking-tight text-slate-900">GreenThread Tasks</h1>
        </div>
        <span id="connectionStatus" class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium bg-amber-50 text-amber-700 border border-amber-200">
                <span class="w-1.5 h-1.5 rounded-full bg-amber-500 animate-pulse"></span> Connecting...
            </span>
    </div>
</header>

<main class="max-w-5xl mx-auto px-4 mt-8 grid grid-cols-1 items-start gap-8 md:grid-cols-3">

    <section class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm md:col-span-1 sticky top-20">
        <h2 class="text-lg font-semibold text-slate-900 mb-4 flex items-center gap-2">
            <svg class="w-5 h-5 text-slate-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"></path></svg>
            New Task
        </h2>

        <form id="taskForm" class="space-y-4">
            <div>
                <label for="taskTitle" class="block text-xs font-medium text-slate-600 mb-1">Title (min 5 chars) *</label>
                <input type="text" id="taskTitle" minlength="5" maxlength="100" required placeholder="E.g., Complete project report"
                       class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500">
            </div>

            <div>
                <label for="taskDescription" class="block text-xs font-medium text-slate-600 mb-1">Description</label>
                <textarea id="taskDescription" maxlength="500" rows="3" placeholder="Add details..."
                          class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500"></textarea>
            </div>

            <div>
                <label for="taskDate" class="block text-xs font-medium text-slate-600 mb-1">Due Date (Future) *</label>
                <input type="datetime-local" id="taskDate" required
                       class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500">
            </div>

            <div>
                <label for="taskStatus" class="block text-xs font-medium text-slate-600 mb-1">Initial Status</label>
                <select id="taskStatus" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm bg-white focus:outline-none focus:border-emerald-500">
                    <option value="PENDING">PENDING</option>
                    <option value="IN_PROGRESS">IN_PROGRESS</option>
                    <option value="COMPLETED">COMPLETED</option>
                </select>
            </div>

            <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-2 px-4 rounded-lg text-sm transition shadow-sm">
                Create Task
            </button>
        </form>
    </section>

    <section class="md:col-span-2 space-y-4">
        <div class="flex justify-between items-center">
            <h2 class="text-lg font-semibold text-slate-900">Current Tasks</h2>
            <button onclick="fetchData()" class="text-xs text-slate-500 hover:text-emerald-600 underline flex items-center gap-1">
                <svg class="w-3 h-3" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                Refresh
            </button>
        </div>

        <div id="taskList" class="space-y-4">
        </div>
    </section>
</main>

<div id="subtaskModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-xl shadow-lg border border-slate-100 w-full max-w-md overflow-hidden animate-in fade-in zoom-in-95 duration-150">
        <div class="px-6 py-4 border-b border-slate-100 flex justify-between items-center">
            <h3 class="font-semibold text-slate-900 text-base">Add Subtask</h3>
            <button onclick="closeSubtaskModal()" class="text-slate-400 hover:text-slate-600">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>

        <form id="subtaskForm" class="p-6 space-y-4">
            <input type="hidden" id="parentTaskId">
            <div>
                <label for="subtaskTitle" class="block text-xs font-medium text-slate-600 mb-1">Subtask Title (min 5 chars) *</label>
                <input type="text" id="subtaskTitle" minlength="5" maxlength="100" required placeholder="E.g., Review section 1"
                       class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:border-emerald-500">
            </div>
            <div class="flex justify-end gap-3 pt-2">
                <button type="button" onclick="closeSubtaskModal()" class="px-4 py-2 text-sm font-medium text-slate-600 hover:bg-slate-100 rounded-lg transition">Cancel</button>
                <button type="submit" class="px-4 py-2 text-sm font-medium text-white bg-emerald-600 hover:bg-emerald-700 rounded-lg transition shadow-sm">Save Subtask</button>
            </div>
        </form>
    </div>
</div>

<div id="toastBanner" class="fixed bottom-4 right-4 max-w-sm bg-rose-600 text-white text-sm px-4 py-3 rounded-lg shadow-xl hidden flex items-start gap-2.5 z-50 transition-all">
    <svg class="w-5 h-5 shrink-0 mt-0.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
    <div class="flex-1">
        <strong class="block font-medium">Error Occurred</strong>
        <span id="toastMsg" class="text-rose-100 text-xs block mt-0.5"></span>
    </div>
    <button onclick="document.getElementById('toastBanner').classList.add('hidden')" class="text-rose-200 hover:text-white">&times;</button>
</div>

<script src="app.js"></script>
</body>
</html>
